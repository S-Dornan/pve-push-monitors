# Runs both online and experiment telemetry monitors in a single container. This is the main entrypoint for the thesis monitoring system.

services:
  health-monitor:
    image: ghcr.io/s-dornan/pve-push-monitor:latest@sha256:f856779f50078276d4e6a0a5e3b5e9903f35a26b21c50b454b33bb11e9073c3f
    container_name: uptime-kuma-health
    restart: always
    environment:
      - MONITOR_TYPE=health
      - PUSH_URL=${HEALTH_PUSH_URL}
      - PUSH_INTERVAL=${PUSH_INTERVAL}
      - CF_CLIENT_ID=${CF_CLIENT_ID}
      - CF_CLIENT_SECRET=${CF_CLIENT_SECRET}

  stream-monitor:
    image: ghcr.io/s-dornan/pve-push-monitor:latest@sha256:f856779f50078276d4e6a0a5e3b5e9903f35a26b21c50b454b33bb11e9073c3f
    container_name: uptime-kuma-stream
    restart: always
    environment:
      - MONITOR_TYPE=stream
      - PUSH_URL=${STREAM_PUSH_URL}
      - PUSH_INTERVAL=${PUSH_INTERVAL}
      - CF_CLIENT_ID=${CF_CLIENT_ID}
      - CF_CLIENT_SECRET=${CF_CLIENT_SECRET}
    volumes:
      - /home/ubuntu/experiment-telemetry.log:/var/log/experiment-telemetry.log:ro
