name: Build and Push PVE Thesis Monitor

on:
  schedule:
    - cron: '0 1 * * *' # Runs nightly at 01:00 UTC (1 hour after pve-prod-base)
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Required permissions for pushing to GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate Source SBOM
        run: |
          curl -Lo $RUNNER_TEMP/sbom-tool https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64
          chmod +x $RUNNER_TEMP/sbom-tool
          
          # Adjusted namespace to point to GitHub
          $RUNNER_TEMP/sbom-tool generate -b ./log-monitor -bc ./log-monitor -pn PVEThesisMonitor -pv 1.0.0 -ps InfrastructureTeam -nsb https://github.com/${{ github.repository }}/sbom/pve-thesis-monitor -V Verbose

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pve-thesis-monitor-source-sbom-manifest
          path: ./log-monitor/_manifest
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pve-push-monitor
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./log-monitor
          platforms: linux/amd64
          load: true
          tags: 'pve-push-monitor:local-scan-thesis'
          no-cache: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: 'pve-push-monitor:local-scan-thesis'
          format: 'table'
          exit-code: '1' # Block pushes on critical or high vulnerability detection.
          severity: 'CRITICAL,HIGH'

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./log-monitor
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}